<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your sign-in — Recruitment Data and Analytics Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="shortcut icon" href="https://udder.rocks/hubfs/Udder_October2022/images/favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#ececec; --panel:#ffffff; --panel2:#f4f4f4; --line:#e2e2e2;
    --line2:#cfcfcf; --ink:#1d1d1b; --muted:#63656a; --muted2:#8c8e93;
    --signal:#e2000f;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;
    line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}

  header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:20px;padding:16px 26px;max-width:1560px;margin:0 auto}
  .brand{display:flex;align-items:baseline;gap:11px}
  .tick{width:10px;height:20px;background:var(--signal);transform:translateY(3px)}
  .brand h1{font-size:16px;font-weight:700}
  .brand .sub{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.16em}

  main{min-height:calc(100% - 64px);display:flex;align-items:center;justify-content:center;padding:48px 20px}
  .card{width:100%;max-width:420px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;
    box-shadow:0 24px 60px rgba(0,0,0,.06);position:relative;padding:44px 44px 36px}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--signal)}
  .card h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
  .card .lede{font-size:13px;color:var(--muted);margin-bottom:28px;max-width:52ch}

  .field label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:7px}
  .code-in{width:100%;font-family:var(--sans);font-size:24px;font-weight:600;letter-spacing:.5em;text-align:center;
    color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:2px;padding:12px 13px 12px calc(13px + .5em);
    transition:.15s;font-variant-numeric:tabular-nums}
  .code-in:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px rgba(226,0,15,.08)}
  .code-in::placeholder{color:var(--line2)}

  .btn-primary{width:100%;margin-top:18px;font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:#fff;background:var(--signal);border:1px solid var(--signal);
    padding:13px 16px;border-radius:2px;cursor:pointer;transition:.15s}
  .btn-primary:hover{background:#c4000d;border-color:#c4000d}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary:disabled{opacity:.55;cursor:default;transform:none}
  .btn-primary:focus-visible,.link:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  .err-msg{background:#fdf0f1;border:1px solid var(--signal);color:var(--signal);
    padding:11px 14px;border-radius:2px;font-size:12.5px;margin-top:16px}
  .err-msg:empty{display:none}

  .foot-note{margin-top:26px;font-size:11px;color:var(--muted2);text-align:center}
  .link{color:var(--signal);text-decoration:none;border:none;background:none;font:inherit;cursor:pointer;
    border-bottom:1px solid transparent}
  .link:hover{border-bottom-color:var(--signal)}

  @media(max-width:560px){.card{padding:36px 24px 28px}.bar{padding:12px 16px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="tick"></span>
      <div><h1>Recruiting Dashboard</h1>
        <div class="sub">Recruitment Data and Analytics Dashboard</div></div>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <h2>Enter your authentication code</h2>
    <p class="lede">Open your authenticator app and enter the 6-digit code for this dashboard.</p>

    <div class="field">
      <label for="code">Authentication code</label>
      <input class="code-in" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    </div>
    <button class="btn-primary" id="verify">Verify</button>
    <div class="err-msg" id="error" role="alert"></div>

    <div class="foot-note">
      Lost your phone? Contact <a href="#" class="link">IT Service Desk</a> to reset two-factor.<br>
      <button class="link" id="signout" style="margin-top:8px">Sign in as someone else</button>
    </div>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/assets/js/core/mfa.js"></script>
<script type="module">
  import { initAuth, logout } from '/assets/js/core/auth.js';

  document.getElementById('signout').onclick = async () => {
    try { await logout(); } catch (e) {}
    location.href = '/login.html';
  };

  const token = await initAuth();
  if (!token) {
    location.replace('/login.html');
  } else {
    MFA.setToken(token);
    MFA.initVerify({ code: '#code', button: '#verify', error: '#error' });
  }
</script>
</body>
</html>
