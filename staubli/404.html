<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #000;
    }
    .container {
      display: flex;
      align-items: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin: 0;
      padding-right: 1.5rem;
    }
    .divider {
      width: 1px;
      height: 2.5rem;
      background: rgba(0, 0, 0, 0.3);
      margin: 0 1.5rem;
    }
    p {
      font-size: 0.95rem;
      color: #444;
      margin: 0;
      padding-left: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000;
        color: #fff;
      }
      .divider {
        background: rgba(255, 255, 255, 0.3);
      }
      p {
        color: #ccc;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <div class="divider"></div>
    <p>This page could not be found.</p>
  </div>
</body>
</html>
