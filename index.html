<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udder BI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f0f0f; --paper:#ffffff; --muted:#6b6b6b; --muted2:#9a9a9a;
    --line:#e6e6e6; --line2:#d4d4d4;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    min-height:100%;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  header{padding:26px 40px;border-bottom:1px solid var(--line)}
  .brand{display:inline-flex;align-items:center;gap:10px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--ink);flex:none}
  .brand span{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 32px}

  .card{text-align:center;max-width:520px;width:100%}

  .eyebrow{
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted2);margin-bottom:20px;display:inline-flex;align-items:center;gap:10px;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:20px;height:1px;background:var(--line2)}

  h1{
    font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:var(--ink);
  }

  p.lead{
    margin-top:16px;font-size:15px;line-height:1.65;color:var(--muted);
    max-width:400px;margin-left:auto;margin-right:auto;
  }

  .btn-login{
    margin-top:38px;display:inline-flex;align-items:center;gap:9px;
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:.03em;
    color:#fff;background:var(--ink);
    border:1px solid var(--ink);padding:14px 30px;border-radius:2px;cursor:pointer;
    text-decoration:none;transition:.15s;
  }
  .btn-login:hover{background:#fff;color:var(--ink)}
  .btn-login:hover svg path{stroke:var(--ink)}
  .btn-login svg path{transition:.15s}
  .btn-login svg{flex:none}

  .foot{margin-top:56px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}

  footer{padding:20px 40px;border-top:1px solid var(--line);font-size:11px;color:var(--muted2);text-align:center}

  @media(prefers-reduced-motion:reduce){.btn-login{transition:none}.btn-login svg path{transition:none}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <span>Udder</span>
  </div>
</header>

<main>
  <div class="card">
    <div class="eyebrow">HR Tech Intelligence</div>

    <h1>Welcome to Udder BI Dashboard</h1>
    <p class="lead">Recruitment and workforce analytics, unified. Sign in to view your live pipeline, sourcing performance, and hiring metrics.</p>

    <a class="btn-login" href="login.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <path d="M15 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 17L15 12L10 7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 12H3" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sign in to continue
    </a>

    <div class="foot">Udder · Business Intelligence</div>
  </div>
</main>

<footer>© 2026 The Udder Group Limited</footer>

</body>
</html>
